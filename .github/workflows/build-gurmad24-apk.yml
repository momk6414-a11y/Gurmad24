name: Build GURMAD 24 Android APK

on:
  push:
    branches:
      - main
      - feature/native-premium-home-and-splash
      - release/official-gurmad24-android
    paths:
      - "mobile-native/**"
      - ".github/workflows/build-gurmad24-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "mobile-native/**"
      - ".github/workflows/build-gurmad24-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build official GURMAD 24 pilot APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile-native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: mobile-native/package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "latest"
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          accept-android-sdk-licenses: true

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android

      # React Native's legacy variant API is not yet compatible with AGP 9's default DSL.
      - name: Keep Android legacy DSL enabled for React Native
        run: printf '\nandroid.newDsl=false\n' >> android/gradle.properties

      - name: Type-check React Native app
        run: npm run typecheck

      # A debug APK expects Metro. A release APK embeds index.android.bundle.
      - name: Build standalone release APK
        working-directory: mobile-native/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify embedded JavaScript bundle
        working-directory: mobile-native/android
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'assets/index.android.bundle|assets/index.android.bundle.hbc'

      - name: Upload official GURMAD 24 pilot APK
        uses: actions/upload-artifact@v4
        with:
          name: gurmad24-android-official-pilot-apk
          path: mobile-native/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
