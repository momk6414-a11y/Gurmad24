name: Build GURMAD 24 Android APK

on:
  push:
    branches:
      - main
      - feature/native-premium-home-and-splash
    paths:
      - "mobile-native/**"
      - ".github/workflows/build-gurmad24-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "mobile-native/**"
      - ".github/workflows/build-gurmad24-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build standalone test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile-native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: mobile-native/package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "latest"
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          accept-android-sdk-licenses: true

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android

      - name: Type-check React Native app
        run: npm run typecheck

      # A debug APK expects Metro. A release APK embeds index.android.bundle.
      - name: Build standalone release APK
        working-directory: mobile-native/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify standalone APK package, signature and bundle
        working-directory: mobile-native/android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          APP_ID="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")"
          test "$APP_ID" = "so.gurmad24.test"
          unzip -l "$APK" | grep -Eq 'assets/index\\.android\\.bundle(\\.hbc)?$'
          echo "Verified Android package ID: $APP_ID"

      - name: Upload standalone test APK
        uses: actions/upload-artifact@v4
        with:
          name: gurmad24-android-standalone-test-apk
          path: mobile-native/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
