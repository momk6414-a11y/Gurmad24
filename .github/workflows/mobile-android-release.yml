name: Mobile - Android release (signed AAB for Google Play)

# Needs these repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of your upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password
# Optional (for push notifications):
#   GOOGLE_SERVICES_JSON_BASE64  base64 of Firebase google-services.json
# See mobile/README_SOMALI.md for the exact steps.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown to users (e.g. 1.0.0)"
        default: "1.0.0"

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - name: Check signing secrets exist
        run: |
          missing=0
          for v in KS_B64 KS_PASS KEY_ALIAS KEY_PASS; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v (see mobile/README_SOMALI.md)"; missing=1; fi
          done
          exit $missing
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - name: Create Android project (only if not committed yet)
        run: '[ -d android ] || npx cap add android'
      - name: Generate icons and splash screens
        run: npx capacitor-assets generate --android
      - name: Add Firebase config (optional, for push notifications)
        run: |
          if [ -n "$GS_B64" ]; then echo "$GS_B64" | base64 -d > android/app/google-services.json; echo "google-services.json added"; else echo "No GOOGLE_SERVICES_JSON_BASE64 secret - building without push"; fi
      - name: Set version
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${{ inputs.version_name }}\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle
      - run: npx cap sync android
      - name: Build release AAB
        working-directory: mobile/android
        run: ./gradlew bundleRelease
      - name: Sign AAB with your upload key
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass:env KS_PASS -keypass:env KEY_PASS \
            "$AAB" "$KEY_ALIAS"
          jarsigner -verify "$AAB" | tail -1
          cp "$AAB" gurmad24-release.aab
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: gurmad24-release-aab
          path: mobile/gurmad24-release.aab
          retention-days: 14
