name: Mobile - Android build

on:
  workflow_dispatch:
  push:
    paths: ["mobile/**", ".github/workflows/mobile-android.yml"]

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - name: Create Android project (only if not committed yet)
        run: '[ -d android ] || npx cap add android'
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gurmad24-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
