name: Mobile - Android build

on:
  workflow_dispatch:
  push:
    paths: ["mobile/**", ".github/workflows/mobile-android.yml"]

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - name: Create Android project (only if not committed yet)
        run: '[ -d android ] || npx cap add android'
      - name: Generate icons and splash screens from mobile/assets
        run: npx capacitor-assets generate --android
      - name: Add Firebase config (optional, for push notifications)
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: '[ -z "$GS_B64" ] || echo "$GS_B64" | base64 -d > android/app/google-services.json'
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: gurmad24-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
