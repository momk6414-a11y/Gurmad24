name: Encrypted GURMAD24 database backup

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: gurmad24-encrypted-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: bash scripts/validate-backup-env.sh

      - name: Install PostgreSQL 17 client and GPG
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ca-certificates curl gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor --yes -o /usr/share/keyrings/postgresql.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version

      - name: Test database connection
        shell: bash
        env:
          PGCONNECT_TIMEOUT: '30'
          PGSSLMODE: require
        run: |
          set -euo pipefail
          if ! /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align \
              --command "select count(*) from gurmad24.records" >/tmp/records-count 2>/tmp/psql-error; then
            echo "::error::Could not read gurmad24.records. Check the database password, that the Session pooler string is used (port 5432), and that the project is not paused."
            sed -E 's#(postgres(ql)?://)[^@ ]*@#\1***@#g' /tmp/psql-error | head -5
            exit 1
          fi
          echo "Connected. gurmad24.records rows: $(tr -d '[:space:]' </tmp/records-count)"

      - name: Dump and encrypt database
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          file="gurmad24-${stamp}.dump.gpg"
          printf '%s' "$BACKUP_ENCRYPTION_KEY" > /tmp/gurmad24-backup-passphrase
          chmod 600 /tmp/gurmad24-backup-passphrase
          export PGCONNECT_TIMEOUT=30 PGSSLMODE=require
          # Only the application schema: that is where all GURMAD 24 data lives (Supabase internal schemas are managed by Supabase).
          /usr/lib/postgresql/17/bin/pg_dump --format=custom --no-owner --no-acl --schema=gurmad24 "$SUPABASE_DB_URL" \
            | gpg --batch --yes --pinentry-mode loopback \
                --passphrase-file /tmp/gurmad24-backup-passphrase \
                --symmetric --cipher-algo AES256 --s2k-mode 3 \
                --s2k-digest-algo SHA512 --output "$file"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file /tmp/gurmad24-backup-passphrase \
            --decrypt --output /tmp/gurmad24-verify.dump "$file"
          /usr/lib/postgresql/17/bin/pg_restore --list /tmp/gurmad24-verify.dump >/tmp/gurmad24-toc
          grep -q "TABLE DATA gurmad24 records" /tmp/gurmad24-toc || { echo "::error::The backup does not contain the gurmad24.records table data."; exit 1; }
          size="$(stat -c %s "$file")"
          echo "Encrypted backup created: $file (${size} bytes), restore test list OK."
          rm -f /tmp/gurmad24-toc
          rm -f /tmp/gurmad24-verify.dump /tmp/gurmad24-backup-passphrase
          echo "BACKUP_FILE=$file" >> "$GITHUB_ENV"

      - name: Store encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: gurmad24-encrypted-db-backup
          path: ${{ env.BACKUP_FILE }}
          if-no-files-found: error
          retention-days: 90
