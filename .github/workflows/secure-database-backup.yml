name: Encrypted GURMAD24 database backup

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: gurmad24-encrypted-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_DB_URL" ]]; then
            echo "::error::Add the SUPABASE_DB_URL repository secret."
            exit 1
          fi
          if [[ ${#BACKUP_ENCRYPTION_KEY} -lt 32 ]]; then
            echo "::error::BACKUP_ENCRYPTION_KEY must contain at least 32 characters."
            exit 1
          fi

      - name: Dump and encrypt database
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          file="gurmad24-${stamp}.dump.enc"
          pg_dump --format=custom --no-owner --no-acl "$SUPABASE_DB_URL" \
            | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 310000 \
                -pass env:BACKUP_ENCRYPTION_KEY -out "$file"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 310000 \
            -pass env:BACKUP_ENCRYPTION_KEY -in "$file" -out /tmp/gurmad24-verify.dump
          pg_restore --list /tmp/gurmad24-verify.dump >/dev/null
          rm -f /tmp/gurmad24-verify.dump
          echo "BACKUP_FILE=$file" >> "$GITHUB_ENV"

      - name: Store encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: gurmad24-encrypted-db-backup
          path: ${{ env.BACKUP_FILE }}
          if-no-files-found: error
          retention-days: 90
