<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Gurmad Emergency Ambulance</title>
  <desc id="desc">The original protective heart and helping hand, now carrying a blue emergency ambulance with a red medical cross and red warning light.</desc>
  <defs>
    <linearGradient id="heartStroke" x1="35" y1="24" x2="205" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D71920"/><stop offset=".48" stop-color="#0B3D91"/><stop offset="1" stop-color="#082B66"/>
    </linearGradient>
    <linearGradient id="handFill" x1="56" y1="138" x2="184" y2="204" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F8FF"/><stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="softShadow" x="5" y="5" width="230" height="230" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0B3D91" flood-opacity=".14"/>
    </filter>
  </defs>
  <g filter="url(#softShadow)">
    <!-- Preserve the original heart and helping-hand identity. -->
    <path d="M120 211C105 199 31 149 22 91 15 45 67 13 108 48l12 11 12-11c41-35 93-3 86 43-7 48-52 91-98 120Z"
      fill="#FFFFFF" stroke="url(#heartStroke)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M48 146c15-4 29-2 42 5l27 14c7 4 15 3 21-2l31-25c7-6 17-5 22 2 4 6 3 14-3 19l-35 30c-15 12-34 15-52 8l-31-13c-10-4-19-6-29-6"
      fill="url(#handFill)" stroke="#0B3D91" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Medical cross remains the central emergency-care signal. -->
    <path d="M120 75v37M101.5 93.5h37" fill="none" stroke="#D71920" stroke-width="11" stroke-linecap="round"/>
    <!-- Small ambulance carried by the helping hand: navy body, red beacon and red cross. -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <path d="M99 126h34l10 10h8a5 5 0 0 1 5 5v7H94v-17a5 5 0 0 1 5-5Z" fill="#0B3D91" stroke="#082B66" stroke-width="2.5"/>
      <path d="M135 129v10h12l-9-10Z" fill="#E8F1FB" stroke="#E8F1FB" stroke-width="1"/>
      <path d="M109 126v-5h13v5" fill="none" stroke="#D71920" stroke-width="4"/>
      <path d="M114 120h4" stroke="#D71920" stroke-width="4"/>
      <path d="M103 137v-5h12v5M109 131v12M103 137h12" fill="none" stroke="#FFFFFF" stroke-width="2.7"/>
      <circle cx="106" cy="149" r="5" fill="#FFFFFF" stroke="#082B66" stroke-width="2.5"/>
      <circle cx="145" cy="149" r="5" fill="#FFFFFF" stroke="#082B66" stroke-width="2.5"/>
    </g>
    <path d="m84 145 8-5" fill="none" stroke="#D71920" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>