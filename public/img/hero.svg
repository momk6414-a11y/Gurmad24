<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
<title id="title">GURMAD 24 — The Legend</title>
<desc id="desc">One connected emergency response network linking people, GPS, ambulance, hospitals, police, fire and support.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123d49"/><stop offset="1" stop-color="#06191f"/></linearGradient>
 <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#20b99b"/><stop offset="1" stop-color="#087a79"/></linearGradient>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#48e0b2"/><stop offset="1" stop-color="#7cc4ff"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
 <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#9bd7d1" stroke-opacity=".08"/></pattern>
 </defs>
<rect width="900" height="620" rx="34" fill="url(#bg)"/><rect width="900" height="620" rx="34" fill="url(#grid)"/>
<circle cx="450" cy="300" r="205" fill="#48e0b2" opacity=".08" filter="url(#shadow)"/>
<!-- connected network -->
<g fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 12" opacity=".9">
 <path d="M450 300L190 130M450 300L450 105M450 300L710 130M450 300L190 475M450 300L450 510M450 300L710 475"/>
</g>
<g fill="#48e0b2"><circle cx="320" cy="215" r="6"/><circle cx="450" cy="195" r="6"/><circle cx="580" cy="215" r="6"/><circle cx="320" cy="390" r="6"/><circle cx="450" cy="415" r="6"/><circle cx="580" cy="390" r="6"/></g>
<!-- central command hub -->
<circle cx="450" cy="300" r="112" fill="#48e0b2" opacity=".12"/>
<circle cx="450" cy="300" r="88" fill="url(#hub)" stroke="#a8ffe7" stroke-width="3"/>
<path d="M450 248v104M398 300h104" stroke="#fff" stroke-width="17" stroke-linecap="round"/>
<circle cx="450" cy="300" r="14" fill="#fff"/>
<text x="450" y="414" fill="#eafff8" font-family="system-ui,sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="3">GURMAD 24</text>
