
# GURMAD 24 - Render Free Demo
# Xogta Free plan-ku waa ku-meel-gaar.
# Ha gelin xog bukaan oo dhab ah.
services:
  - type: web
    name: gurmad24
    runtime: node
    plan: free
    buildCommand: "npm install"
    startCommand: "node server.js"
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /tmp/gurmad24-data
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      # Free plan = NO persistent disk: data is wiped on every restart/deploy.
      # To keep data: upgrade the plan, add a disk (e.g. 1GB at /var/data), then set
      #   DATA_DIR=/var/data  and  PERSISTENT_STORAGE=true   (and remove the /tmp value above).
      - key: DEMO_MODE
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
